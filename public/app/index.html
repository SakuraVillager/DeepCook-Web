<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130D" />
    <title>在线版 · 正在备菜 — DeepCook</title>
    <style>
      :root {
        --paper: #f3ede0;
        --paper-2: #e9e1d1;
        --ink: #16130d;
        --yolk: #f0b41c;
        --chili: #c8472b;
        --line: rgba(22, 19, 13, 0.16);
        --ease: cubic-bezier(0.165, 0.84, 0.44, 1);
        --gutter: clamp(20px, 4vw, 52px);
        --zh: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        --en: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --serif: Georgia, 'Times New Roman', serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--ink);
        color: var(--paper);
        font-family: var(--zh);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      .page { min-height: 100svh; display: flex; flex-direction: column; }
      .top {
        display: flex; align-items: center; justify-content: space-between;
        padding: 26px var(--gutter); gap: 20px;
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; }
      .seal {
        width: 25px; height: 25px; border: 1px solid var(--paper);
        display: grid; place-items: center; font-size: 12px; font-weight: 700;
      }
      .word {
        font-family: var(--en); font-size: 12px; font-weight: 700;
        letter-spacing: 0.3em;
      }
      .back {
        font-size: 11px; letter-spacing: 0.18em;
        border-bottom: 1px solid rgba(243, 237, 224, 0.5); padding-bottom: 3px;
        transition: color 0.3s var(--ease);
      }
      .back:hover { color: var(--yolk); }
      .main {
        flex: 1; display: grid; grid-template-columns: 1.15fr 0.85fr;
        align-items: center; gap: clamp(30px, 6vw, 100px);
        width: 100%; max-width: 1400px; margin: 0 auto;
        padding: clamp(30px, 4vw, 60px) var(--gutter);
      }
      .label {
        font-family: var(--en); font-size: 10px; font-weight: 600;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--yolk);
      }
      h1 {
        margin: 18px 0 0;
        font-size: clamp(56px, 9vw, 138px);
        line-height: 1.02; letter-spacing: -0.055em; font-weight: 900;
      }
      h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.03em; }
      .lead {
        max-width: 480px; margin-top: 24px;
        font-size: 14px; line-height: 1.95; color: rgba(243, 237, 224, 0.62);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      .btn {
        display: inline-flex; align-items: center; gap: 16px;
        min-height: 54px; padding: 0 24px; border-radius: 999px;
        border: 1px solid rgba(243, 237, 224, 0.5);
        font-size: 12px; letter-spacing: 0.12em;
        transition: background-color 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease);
      }
      .btn--yolk { background: var(--yolk); color: var(--ink); border-color: var(--yolk); }
      .btn--yolk:hover { background: var(--paper); border-color: var(--paper); }
      .btn--ghost:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
      .arrow { width: 16px; height: 16px; display: inline-block; position: relative; }
      .arrow::before {
        content: ''; position: absolute; left: 1px; top: 8px; width: 14px; height: 1px;
        background: currentColor;
      }
      .arrow::after {
        content: ''; position: absolute; right: 2px; top: 5px; width: 6px; height: 6px;
        border-top: 1px solid currentColor; border-right: 1px solid currentColor;
        transform: rotate(45deg);
      }
      .visual { position: relative; }
      .visual img {
        width: 100%; aspect-ratio: 4 / 5; object-fit: cover;
        filter: saturate(0.92) brightness(0.9);
      }
      .note {
        position: absolute; left: -18px; bottom: 22px;
        background: var(--yolk); color: var(--ink);
        padding: 10px 14px; font-family: var(--en); font-size: 9px;
        letter-spacing: 0.16em; line-height: 1.8;
      }
      .status {
        display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
        padding: 18px var(--gutter) 24px; border-top: 1px solid rgba(243, 237, 224, 0.18);
        font-family: var(--en); font-size: 9px; letter-spacing: 0.18em;
        color: rgba(243, 237, 224, 0.42);
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--yolk); display: inline-block; margin-right: 7px; }
      .foot { margin-left: auto; }
      @media (max-width: 820px) {
        .main { grid-template-columns: 1fr; padding-top: 10px; }
        .visual { display: none; }
        h1 { font-size: clamp(56px, 16vw, 100px); }
        .status { gap: 12px; }
        .foot { margin-left: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="brand" href="../index.html" aria-label="DeepCook 首页">
          <span class="seal" aria-hidden="true">炊</span>
          <span class="word">DEEPCOOK</span>
        </a>
        <a class="back" href="../index.html">← 返回首页</a>
      </header>

      <main class="main">
        <div>
          <span class="label">Online edition · 在线版</span>
          <h1>
            正在<br />
            <em>备菜。</em>
          </h1>
          <p class="lead">
            你已经走到了 DeepCook 的在线版入口。网页版还在准备中——同一份 494 道离线菜谱，
            加上浏览器里的浏览、搜索和烹饪模式，会把厨房原样搬过来。
          </p>
          <p class="lead" style="margin-top: 12px">
            现在可以先下载 Android 版，完整功能都在那里。
          </p>
          <div class="actions">
            <a class="btn btn--yolk" href="../download/DeepCook-0.5.1-preview.apk" download>
              下载 Android 版 <span class="arrow" aria-hidden="true"></span>
            </a>
            <a class="btn btn--ghost" href="../index.html">
              回到首页 <span class="arrow" aria-hidden="true"></span>
            </a>
          </div>
        </div>

        <div class="visual" aria-hidden="true">
          <img src="../photos/cn-xiaolongbao.jpg" alt="" />
          <div class="note">KITCHEN IN PREPARATION<br />EST. 2026</div>
        </div>
      </main>

      <footer class="status">
        <span><i class="dot"></i>ONLINE EDITION · IN PROGRESS</span>
        <span>494 RECIPES · OFFLINE FIRST</span>
        <span class="foot">DEEPCOOK © 2026</span>
      </footer>
    </div>
  </body>
</html>
