# Inside the HTTPS server block for deepcook-backend.jijiz.cn.
# Preserve the full request path; do not append a slash to proxy_pass.
location ^~ /deepcook-api/ {
    proxy_pass http://127.0.0.1:8391;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    client_body_timeout 30s;
    client_max_body_size 1m;
    access_log off;
}

# Local scheduled backups call this directly on port 8391, never through the website.
location ^~ /internal/ {
    return 404;
}

location / {
    return 404;
}
